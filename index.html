<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffe5ef"><title>Gửi Khanhhh Ha 💗</title>
<style>
:root{--pink:#ff79ad;--deep:#d94e8a;--paper:#fffafc;--ink:#6f3652}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at top,#fff7fb 0,#ffe4ef 48%,#ffd3e4 100%);overflow-x:hidden}
.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;position:relative}.glow{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;background:#ff9dc4;left:-100px;top:15%}.glow.two{left:auto;top:auto;right:-110px;bottom:5%;background:#f7a9d7}
main{width:min(100%,560px);position:relative;z-index:1;text-align:center}.kicker{font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;color:#b55b82;margin-bottom:12px}h1{font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.4rem);line-height:1.05;margin:0 0 12px;color:#c84e83}.sub{margin:0 auto 25px;max-width:390px;line-height:1.6;color:#91516d}
.envelope-area{perspective:1000px;margin:0 auto 18px;width:min(100%,380px);height:245px;position:relative}.envelope{position:absolute;inset:38px 0 0;background:#ff8fba;border-radius:10px;box-shadow:0 18px 35px #c95b8533;overflow:visible}.envelope:before{content:"";position:absolute;inset:0;border-radius:10px;background:#ffb2cf;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}.flap{position:absolute;inset:0 0 auto;height:70%;background:#f96fa7;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:4}.seal{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#fff0f6;display:grid;place-items:center;font-size:27px;box-shadow:0 4px 12px #a8326030;transition:opacity .3s}.letter{position:absolute;z-index:2;left:7%;width:86%;bottom:8px;min-height:175px;background:var(--paper);border-radius:10px;padding:22px 18px 20px;box-shadow:0 6px 18px #a8326020;transform:translateY(0);transition:transform .9s ease;display:flex;flex-direction:column;justify-content:center}.letter h2{font-family:Georgia,serif;color:#cf4f87;font-size:1.45rem;margin:0 0 10px}.letter p{line-height:1.65;margin:0;font-size:1rem}
.open .flap{transform:rotateX(180deg);z-index:1}.open .letter{transform:translateY(-110px);transition-delay:.15s}.open .seal{opacity:0}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 18px}button{border:0;border-radius:999px;padding:13px 20px;font-size:1rem;font-weight:650;cursor:pointer;box-shadow:0 6px 16px #c34c7b25;transition:transform .15s}button:active{transform:scale(.97)}.primary{background:#df5d94;color:white}.secondary{background:#fff5f9;color:#bd477d;border:1px solid #ffc1d9}.hint{font-size:.86rem;color:#a35b7a;margin-top:12px}.heart{position:fixed;bottom:-35px;z-index:0;pointer-events:none;animation:float 7s linear forwards;opacity:.75}@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.75}100%{transform:translateY(-110vh) rotate(35deg);opacity:0}}
@media(max-width:400px){.envelope-area{height:225px}.letter{min-height:160px;padding:18px 14px}.open .letter{transform:translateY(-95px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="glow"></div><div class="glow two"></div><div class="wrap"><main><div class="kicker">Một chiếc thiệp nhỏ xíu 💌</div><h1>Gửi Khanhhh Ha</h1><p class="sub">Có một lời chúc đáng yêu đang chờ được mở ra nèee 🌷</p>
<div class="envelope-area" id="envelopeArea" aria-label="Phong bì thư"><div class="envelope"><div class="letter"><h2>Chúc chụ 20/10 💗</h2><p>Chúc chụ 20/10 thật zuii zẻ, luôn xênhh depp hạnh phúc và iuu đời !💗</p></div><div class="flap"></div><div class="seal">💗</div></div></div>
<div class="actions"><button class="primary" id="openBtn">Mở thư nè 💌</button><button class="secondary" id="againBtn">Đóng lại 🌸</button></div><p class="hint">Một chút ngọt ngào dành riêng cho cậu ✨</p></main></div>
<script>const area=document.getElementById('envelopeArea');document.getElementById('openBtn').addEventListener('click',()=>{area.classList.add('open');burst()});document.getElementById('againBtn').addEventListener('click',()=>area.classList.remove('open'));function burst(){for(let i=0;i<12;i++){const h=document.createElement('span');h.className='heart';h.textContent=['💗','💕','💖','🌸'][Math.floor(Math.random()*4)];h.style.left=(5+Math.random()*90)+'vw';h.style.fontSize=(16+Math.random()*18)+'px';h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8500)}}</script></body></html>
